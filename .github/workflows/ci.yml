name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --select E4,E7,E9,F ."

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -v
      - name: Run demo CLI smoke test
        run: |
          python examples/generate_demo_glbs.py
          glbdiff diff examples/samples/character_v1.glb examples/samples/character_v2.glb
          glbdiff textconv examples/samples/character_v1.glb
          glbdiff summary examples/samples/character_v1.glb examples/samples/character_v2.glb --provider heuristic
